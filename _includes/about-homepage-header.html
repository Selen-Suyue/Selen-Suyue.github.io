    /* Responsive publication media: keep every item inside the same aspect-ratio frame. */
    .pub-media-rotator {
        position: relative;
        width: 200px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 5 / 3;
        margin-right: 20px;
        border-radius: 8px;
        overflow: hidden;
        flex: 0 0 auto;
        background: #fff;
    }
    .pub-media-rotator > img,
    .pub-media-rotator > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
    }
    .publication-card .pub-media-rotator > img.pub-media-rotator__overview {
        object-fit: contain !important;
        object-position: center !important;
        background: #fff;
        box-sizing: border-box;
    }
    .pub-media-rotator > .pub-media-rotator__video {
        object-fit: cover;
        object-position: center;
    }
    /*
     * The SG-WAM teaser's Ours panel occupies x=920..1836 of the 1836px source.
     * Clip the left comparison panel, then center the complete Ours panel.
     * Percentages make the crop scale with both desktop and mobile frames.
     */
    .publication-card .pub-media-rotator > img.pub-media-rotator__teaser {
        position: absolute;
        inset: auto;
        top: 0;
        left: 50%;
        width: auto !important;
        height: 100% !important;
        max-width: none !important;
        object-fit: fill !important;
        object-position: center !important;
        clip-path: inset(0 0 0 50.109%);
        transform: translateX(-75.0545%);
        transform-origin: center;
        background: #fff;
    }

    /* Kindred: a quiet, editorial carousel that borrows the homepage palette. */
    .kindred-showcase {
        --kindred-rose: #ca6f6f;
        --kindred-blue: #9bbddd;
        --kindred-lilac: #aaa1b2;
        position: relative;
        overflow: hidden;
        margin: 16px 0 30px;
        padding: clamp(22px, 4vw, 38px);
        border: 1px solid rgba(170, 161, 178, 0.26);

        background:
            radial-gradient(circle at 90% 5%, rgba(155, 189, 221, 0.20), transparent 31%),
            radial-gradient(circle at 8% 100%, rgba(202, 111, 111, 0.13), transparent 34%),
            linear-gradient(135deg, #fffafa 0%, #fbfafc 52%, #f7fafd 100%);
        box-shadow: 0 16px 40px rgba(88, 72, 86, 0.07);
        color: #4f5157;
    }
    .kindred-showcase::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 3px;
        background: linear-gradient(90deg, var(--kindred-rose), var(--kindred-lilac), var(--kindred-blue));

    .kindred-showcase__header {

        gap: 22px;
