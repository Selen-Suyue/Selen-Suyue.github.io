    .pub-legend-group {

    .project-card {
        display: flex;

    .project-card > div > strong,

    .profile-list-section {
        --profile-accent: #6f86a6;

    .profile-list-section--awards {

    .profile-list {

        gap: 6px;
        margin: 0;
        padding: 0;

    }
    .profile-list__item {
        position: relative;
        display: grid;

    .profile-list__date {

    @media (max-width: 520px) {

    body {
        background-color: #FFFFFF;
        font-family: 'Arial Rounded MT Bold', 'Verdana', sans-serif;
        font-size: 15px;
    }
    .main-heading {
        font-family: 'Permanent Marker', cursive;
        text-align: center;
        color: #ca6f6f;
    }
    div.markdown-body a,
    a {
        text-decoration: none !important;
        color: #ca6f6f;
        transition: all 0.3s ease;
    }
    div.markdown-body a:hover,
    a:hover {
        color: #c71585;
        text-decoration: underline;
    }
    /* Responsive publication media: keep every item inside the same aspect-ratio frame. */
    .pub-media-rotator {
        position: relative;
        width: 200px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 5 / 3;
        margin-right: 20px;
        border-radius: 8px;
        overflow: hidden;
        flex: 0 0 auto;
        background: #fff;
    }
    .pub-media-rotator > img,
    .pub-media-rotator > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
    }
    .publication-card .pub-media-rotator > img.pub-media-rotator__overview {
        object-fit: contain !important;
        object-position: center !important;
        background: #fff;
        box-sizing: border-box;
    }
    .pub-media-rotator > .pub-media-rotator__video {
        object-fit: cover;
        object-position: center;
    }
    /*
     * The SG-WAM teaser's Ours panel occupies x=920..1836 of the 1836px source.
     * Clip the left comparison panel, then center the complete Ours panel.
     * Percentages make the crop scale with both desktop and mobile frames.
     */
    .publication-card .pub-media-rotator > img.pub-media-rotator__teaser {
        position: absolute;
        inset: auto;
        top: 0;
        left: 50%;
        width: auto !important;
        height: 100% !important;
        max-width: none !important;
        object-fit: fill !important;
        object-position: center !important;
        clip-path: inset(0 0 0 50.109%);
        transform: translateX(-75.0545%);
        transform-origin: center;
        background: #fff;
    }

    /* Kindred: compact three-up gallery inspired by the WoG carousel. */
    .novel-section {
        margin: 18px 0 26px;
    }
    .novel-section__header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        padding-bottom: 7px;
        border-bottom: 1px solid #f0f1f2;
    }
    .novel-section__title {
        margin: 0;
        color: #3d4147;
        font-size: 1.25em;
        line-height: 1.3;
    }
    .novel-section__series {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        color: #706a72 !important;
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none !important;
        white-space: nowrap;
    }
    .novel-section__series-name {
        color: #9b5d68;
        font-weight: 800;
    }
    .novel-section__series:hover {
        color: #9b5d68 !important;
    }
    .kindred-slideshow {
        --kindred-gap: 12px;
        --kindred-items: 3;
        position: relative;
        width: 100%;
        margin: 0;
        box-sizing: border-box;
    }
    .kindred-slideshow__viewport {
        position: relative;
        overflow: hidden;
        padding: 2px;
        border-radius: 12px;
    }
    .kindred-slideshow__track {
        display: flex;
        gap: var(--kindred-gap);
        width: 100%;
        touch-action: pan-y;
        will-change: transform;
        transition: transform 0.52s cubic-bezier(0.22, 0.78, 0.25, 1);
    }
    .kindred-slide {
        position: relative;
        display: block;
        flex: 0 0 calc((100% - 24px) / 3);
        min-width: 0;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 1px solid rgba(105, 98, 108, 0.2);
        border-radius: 10px;
        background: #ece9ed;
        box-shadow: 0 3px 10px rgba(46, 40, 47, 0.085);
        box-sizing: border-box;
        color: inherit !important;
        transform: translateZ(0);
        transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
    }
    .kindred-slide:hover {
        border-color: rgba(167, 103, 114, 0.34);
        box-shadow: 0 7px 16px rgba(71, 56, 69, 0.13);
        text-decoration: none !important;
        transform: translateY(-2px);
    }
    .kindred-slide__image {
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        object-position: center;
        transition: transform 0.42s ease;
    }
    .kindred-slide:hover .kindred-slide__image {
        transform: scale(1.025);
    }
    .kindred-slide__caption {
        position: absolute;
        inset: auto 0 0;
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        padding: 20px 10px 8px;
        background: linear-gradient(to top, rgba(22, 19, 23, 0.82), rgba(22, 19, 23, 0));
        color: #fff;
        line-height: 1.15;
        pointer-events: none;
    }
    .kindred-slide__chapter {
        flex: 0 0 auto;
        color: rgba(255, 255, 255, 0.68);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
    }
    .kindred-slide__title {
        overflow: hidden;
        color: #fff;
        font-size: 0.72rem;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .kindred-slideshow__control {
        position: absolute;
        z-index: 3;
        top: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid rgba(90, 82, 92, 0.16);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        color: #625c64;
        cursor: pointer;
        box-shadow: 0 3px 12px rgba(30, 26, 31, 0.14);
        backdrop-filter: blur(8px);
        transform: translateY(-50%);
        transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .kindred-slideshow__control--previous {
        left: 7px;
    }
    .kindred-slideshow__control--next {
        right: 7px;
    }
    .kindred-slideshow__control:hover {
        background: #fff;
        box-shadow: 0 5px 15px rgba(30, 26, 31, 0.18);
        transform: translateY(-50%) scale(1.06);
    }
    .kindred-slideshow__control:focus-visible,
    .kindred-slideshow__track:focus-visible,
    .kindred-slide:focus-visible,
    .kindred-slideshow__dot:focus-visible,
    .novel-section__series:focus-visible {
        outline: 3px solid rgba(155, 189, 221, 0.55);
        outline-offset: 2px;
    }
    .kindred-slideshow__pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 16px;
        margin-top: 8px;
    }
    .kindred-slideshow__dot {
        width: 6px;
        height: 6px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #d7d2d8;
        cursor: pointer;
        transition: width 0.2s ease, background-color 0.2s ease;
    }
    .kindred-slideshow__dot[aria-current="true"] {
        width: 18px;
        background: #a86b76;
    }
    @media (max-width: 899px) {
        .kindred-slideshow {
            --kindred-gap: 10px;
            --kindred-items: 2;
        }
        .kindred-slide {

    @media (max-width: 599px) {

        .kindred-slide__caption {
            padding: 24px 12px 9px;
        }
        .kindred-slide__title {
            font-size: 0.78rem;
        }
